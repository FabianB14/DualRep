# Supabase CLI (v2) configuration for local development: `supabase start`, `supabase db reset`,
# `supabase test db`. Reference: https://supabase.com/docs/guides/local-development/cli/config
# Only the settings DualRep depends on are listed; everything else keeps the CLI default.
# Hosted projects are configured in the dashboard (see docs/SETUP.md); keep the auth values there in
# step with this file.

project_id = "dualrep"

[api]
enabled = true
port = 54321
# Schemas served by the Data API. Tables in them still need explicit grants (see the first migration).
schemas = ["public", "graphql_public"]
# pgvector and other extensions live in the `extensions` schema.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the hosted project's Postgres major version (`show server_version;`).
major_version = 17

[db.seed]
# `supabase db reset` runs this after the migrations. It is intentionally empty: data production
# needs (the system presets) lives in the migrations.
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
# The app signs in with a 6-digit email code typed into the app, so redirects are not part of the
# flow. The site URL and allow-list name the app's own schemes (production, development and preview
# builds) so any future deep-link flow can only ever land in the app.
site_url = "dualrep://"
additional_redirect_urls = ["dualrep://**", "dualrep-dev://**", "dualrep-preview://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# On, to match the hosted project (docs/SETUP.md). Signing in with the 6-digit code confirms the
# address in the same step, so the app's flow is unchanged; it also stops anyone from pre-registering
# someone else's address with a password through the public API.
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

# Both emails a sign-in can send (new account / existing account) show the code, not a link.
# Paths are relative to the repository root.
[auth.email.template.magic_link]
subject = "Your DualRep sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Your DualRep sign-in code"
content_path = "./supabase/templates/confirmation.html"

[edge_runtime]
enabled = true
# `per_worker` hot-reloads `supabase functions serve` during local development.
policy = "per_worker"
# The Deno major version for local serving and Docker bundling (CLI 2.119 accepts 1 or 2). Deploys from
# the Deploy backend workflow bundle on Supabase's side (`functions deploy --use-api`).
deno_version = 2

# Edge Functions (supabase/functions/<name>/index.ts; folders starting with `_` are shared code, never
# deployed). verify_jwt is written out for each function because a deploy otherwise keeps whatever the
# deployed function already has (or turns it on for a new one). Both are off on purpose: the gateway's
# check also admits the publishable key, which ships inside the app, so it proves nothing.

# The app's one user-facing function (submit_source, confirm_transcripts, approve_outline, retry_job,
# cancel_job). It verifies the caller's JWT in code (auth.getClaims) before doing anything.
[functions.study]
enabled = true
verify_jwt = false

# Called by pg_cron through pg_net, and by itself, with the x-dualrep-worker-secret header (the
# DUALREP_WORKER_SECRET Edge Function secret = the dualrep_worker_secret Vault secret), never with a
# user JWT. It refuses any request without that secret.
[functions.tracy-worker]
enabled = true
verify_jwt = false
