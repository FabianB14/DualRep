name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (typecheck, lint, tests, sync config)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run validate:sync

  database:
    name: Database (migrations + RLS tests, Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres 16, pgvector and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgvector postgresql-16-pgtap
      - run: npm run db:test
      - name: Schema snapshot is committed and current
        run: git diff --exit-code supabase/schema.snapshot.json

  supabase:
    name: Supabase CLI (real Supabase Postgres image)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the local Supabase database (applies migrations and seed)
        run: supabase db start
      - name: Run the pgTAP tests
        run: supabase test db
      - name: Stop
        if: always()
        run: supabase stop --no-backup
