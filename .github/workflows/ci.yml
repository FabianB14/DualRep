name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (typecheck, lint, tests, sync config, starter library)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run test:scripts
      - run: npm run validate:sync
      - run: npm run check:library

  edge-functions:
    name: Edge Functions (Deno check, lint, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        # supabase/functions/deno.json applies there (npm: imports resolve from npm, not the app's
        # node_modules).
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          # Pinned (Deno 2, like the hosted Edge Runtime). Bump by hand now and then.
          deno-version: 2.2.15
      - run: deno --version
      - name: Type-check both functions and everything they import
        run: deno check study/index.ts tracy-worker/index.ts
      - run: deno lint
      # Pure modules, the worker's step machine and the study actions, against in-memory fakes.
      - run: deno test

  database:
    name: Database (migrations + RLS tests, Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres 16, pgvector and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgvector postgresql-16-pgtap
      - run: npm run db:test
      - name: Schema snapshot is committed and current
        run: git diff --exit-code supabase/schema.snapshot.json

  supabase:
    name: Supabase CLI (real Supabase Postgres image)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving "latest" calls the GitHub API without a token and fails when the shared
          # runner hits its rate limit (main's CI run 37833008329). Bump by hand now and then.
          version: 2.119.0
      - run: supabase --version
      - name: Start the local Supabase database (applies migrations and seed)
        run: supabase db start
      - name: Run the pgTAP tests
        run: supabase test db
      - name: Stop
        if: always()
        run: supabase stop --no-backup
