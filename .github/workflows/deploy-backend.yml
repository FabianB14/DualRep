# Deploys DualRep's Supabase backend from GitHub's runners (no Docker, no database password):
#   1. records the migrations that were pasted into the SQL Editor by hand (only when that is safe);
#   2. `supabase db push` (the CLI mints a temporary login role with the access token and, because
#      GitHub's runners are IPv4-only, connects through the project's session pooler);
#   3. the Edge Functions' secrets (TRACY_URL, TRACY_SERVICE_SECRET, optional GEMINI_API_KEY, caps and
#      worker concurrency);
#   4. the cron -> tracy-worker shared secret: an Edge Function secret plus a copy in Vault, written
#      through the Management API (created on the first run, replaced when asked);
#   5. `supabase functions deploy --use-api` (bundled by Supabase, no Docker);
#   6. a smoke test of both functions.
# Run it by hand: Actions -> Deploy backend -> Run workflow. "Dry run" is ticked by default: it shows
# what would change (the migrations db push would apply, the secrets it would set, the functions now
# deployed) and changes nothing. Untick it to deploy (only from main).
#
# Settings -> Secrets and variables -> Actions:
#   Secrets:   SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens)
#              TRACY_SERVICE_SECRET  (the same value as SERVICE_SECRET_DUALREP on Render)
#              GEMINI_API_KEY        (optional; only with Gemini billing on. Remove it to turn embeddings off)
#   Variables: EXPO_PUBLIC_SUPABASE_URL (already set for the APK; the project ref is read from it)
#              TRACY_URL             (Tracy's Render address, e.g. https://tracy-xxxx.onrender.com)
#              SUPABASE_PROJECT_REF  (optional: only if the URL above is a custom domain)
#              DUALREP_CAP_SOURCES_FREE / _PAID, DUALREP_CAP_PAGES_FREE / _PAID (optional monthly caps;
#              unset = 5 / 30 sources and 20 / 200 pages; "none" = no limit)
#              DUALREP_WORKER_CONCURRENCY (optional: steps running at once for everyone; unset = 1,
#              right for Tracy on Render's free plan)
name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (only show what would change)
        type: boolean
        default: true
      rotate_worker_secret:
        description: Make a new cron -> tracy-worker secret
        type: boolean
        default: false

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    # -e -o pipefail: any failing command (also inside a pipe) stops the step.
    shell: bash

jobs:
  deploy:
    name: ${{ inputs.dry_run && 'Dry run' || 'Deploy' }} to Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL_VAR: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      PROJECT_REF_VAR: ${{ vars.SUPABASE_PROJECT_REF }}
      DRY_RUN: ${{ inputs.dry_run }}
      ROTATE: ${{ inputs.rotate_worker_secret }}
      API: https://api.supabase.com/v1
    steps:
      # The CLI loads and validates the whole supabase/config.toml (and the email templates it names).
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, like ci.yml: resolving "latest" calls the GitHub API without a token.
          version: 2.119.0

      - name: Check the settings
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is missing (Supabase -> Account -> Access Tokens)."
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A real deploy runs from main only (this is $GITHUB_REF). Use a dry run here."
            exit 1
          fi
          ref="$PROJECT_REF_VAR"
          if [ -z "$ref" ] && [[ "$SUPABASE_URL_VAR" =~ ^https://([a-z]{20})\.supabase\.co/?$ ]]; then
            ref="${BASH_REMATCH[1]}"
          fi
          if ! [[ "$ref" =~ ^[a-z]{20}$ ]]; then
            echo "::error::Can't tell the project ref. Set the variable EXPO_PUBLIC_SUPABASE_URL to https://<ref>.supabase.co, or SUPABASE_PROJECT_REF to the 20-letter ref."
            exit 1
          fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          {
            echo "### Deploy backend ($([ "$DRY_RUN" = "true" ] && echo "dry run" || echo "for real"))"
            echo "- Project: \`$ref\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          supabase --version

      # The hosted project got 20261008000000 and 20261008120000 through the SQL Editor, so its
      # migration history (supabase_migrations.schema_migrations) is empty and `db push` would run them
      # again and fail. Record them as applied, but only when the history is empty AND the schema is
      # really there (and the starter library only when its 90 exercises are). Once the history has
      # rows this step does nothing.
      - name: Record migrations applied by hand
        run: |
          list=$(supabase migration list --project-ref "$PROJECT_REF" --output-format json)
          if ! remote=$(jq -er '[.migrations[] | select((.remote // "") != "") | .remote] | join(" ")' <<<"$list"); then
            echo "::error::Could not read the remote migration history; nothing was recorded."
            exit 1
          fi
          echo "Remote migration history: ${remote:-<empty>}"
          if [ -n "$remote" ]; then exit 0; fi
          q() { supabase db query --linked --project-ref "$PROJECT_REF" --agent no -o json "$1"; }
          has_schema=$(q "select to_regclass('public.tracy_events') is not null as v" | jq -r '.[0].v')
          if [ "$has_schema" != "true" ]; then
            echo "An empty database: db push applies every migration."
            exit 0
          fi
          versions="20261008000000"
          starter=$(q "select count(*)::int as v from public.exercises where origin = 'interverse'" | jq -r '.[0].v')
          if [[ "$starter" =~ ^[0-9]+$ ]] && [ "$starter" -ge 90 ]; then
            versions="$versions 20261008120000"
          fi
          echo "- Schema found with an empty history: record $versions as applied" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "(dry run: not recorded, so the plan below still lists them)"
            exit 0
          fi
          read -ra to_record <<<"$versions"
          supabase migration repair "${to_record[@]}" --status applied --project-ref "$PROJECT_REF" --yes

      - name: Database migrations
        run: |
          supabase db push --project-ref "$PROJECT_REF" --dry-run
          if [ "$DRY_RUN" != "true" ]; then
            supabase db push --project-ref "$PROJECT_REF" --yes
            echo "- Migrations pushed" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Secrets the functions read with Deno.env.get. Values go to the CLI through a 0600 file, never
      # on a command line. An optional setting that is not set here is removed from the project, so
      # the functions fall back to their defaults (e.g. no GEMINI_API_KEY = embeddings off).
      - name: Edge Function secrets
        env:
          TRACY_URL: ${{ vars.TRACY_URL }}
          TRACY_SERVICE_SECRET: ${{ secrets.TRACY_SERVICE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DUALREP_CAP_SOURCES_FREE: ${{ vars.DUALREP_CAP_SOURCES_FREE }}
          DUALREP_CAP_SOURCES_PAID: ${{ vars.DUALREP_CAP_SOURCES_PAID }}
          DUALREP_CAP_PAGES_FREE: ${{ vars.DUALREP_CAP_PAGES_FREE }}
          DUALREP_CAP_PAGES_PAID: ${{ vars.DUALREP_CAP_PAGES_PAID }}
          DUALREP_WORKER_CONCURRENCY: ${{ vars.DUALREP_WORKER_CONCURRENCY }}
        run: |
          missing=()
          [[ "$TRACY_URL" =~ ^https://[^[:space:]/]+(/[^[:space:]]*)?$ ]] || missing+=("variable TRACY_URL (https://…)")
          [ -n "$TRACY_SERVICE_SECRET" ] || missing+=("secret TRACY_SERVICE_SECRET")
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::warning::Missing $m: the study builder can't reach Tracy without it."; done
            if [ "$DRY_RUN" != "true" ]; then exit 1; fi
          fi
          existing=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects/$PROJECT_REF/secrets" \
            | jq -r 'if type == "array" then .[].name else empty end')
          umask 077
          env_file="$RUNNER_TEMP/functions.env"
          : > "$env_file"
          set_names=()
          unset_names=()
          for name in TRACY_URL TRACY_SERVICE_SECRET GEMINI_API_KEY \
                      DUALREP_CAP_SOURCES_FREE DUALREP_CAP_SOURCES_PAID DUALREP_CAP_PAGES_FREE DUALREP_CAP_PAGES_PAID \
                      DUALREP_WORKER_CONCURRENCY; do
            value="${!name}"
            if [ -n "$value" ]; then
              if [[ "$value" == *$'\n'* ]]; then echo "::error::$name contains a line break."; exit 1; fi
              printf '%s=%s\n' "$name" "$value" >> "$env_file"
              set_names+=("$name")
            elif grep -qx "$name" <<<"$existing"; then
              unset_names+=("$name")
            fi
          done
          echo "- Function secrets to set: ${set_names[*]:-none}; to remove: ${unset_names[*]:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" != "true" ]; then
            if [ "${#set_names[@]}" -gt 0 ]; then
              supabase secrets set --project-ref "$PROJECT_REF" --env-file "$env_file"
            fi
            if [ "${#unset_names[@]}" -gt 0 ]; then
              supabase secrets unset "${unset_names[@]}" --project-ref "$PROJECT_REF" --yes
            fi
          fi
          rm -f "$env_file"

      # pg_cron calls tracy-worker with a shared secret it reads from Vault (dualrep_worker_secret);
      # the worker compares it with its own DUALREP_WORKER_SECRET. Vault also gets the project URL
      # (dualrep_project_url). The secret is made on the first run, when either copy is missing, or when
      # "Make a new cron -> tracy-worker secret" is ticked. Function first, then Vault: for a few
      # seconds cron may send the old value and get 403; the next minute's run picks the work up.
      # Values reach Postgres as bind parameters of the Management API query endpoint; if the endpoint
      # refuses parameters, they are inlined instead (both are plain [0-9a-z:/.-] strings checked
      # here, so inlining cannot inject SQL). They never appear in the log (::add-mask::).
      - name: Worker secret (Edge Function secret + Vault)
        run: |
          query() {  # query <sql> [params...]: one statement as postgres; prints the rows as JSON
            local body
            body=$(jq -n --arg q "$1" '{query: $q, parameters: $ARGS.positional}' --args "${@:2}")
            curl -fsS -X POST "$API/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data "$body"
          }
          # $1 and $2 in single quotes below are SQL parameters, not shell variables.
          # shellcheck disable=SC2016
          inline() {  # inline <sql with $1 and $2> <name> <value>: for when parameters are refused
            [[ "$2" =~ ^[a-z_]+$ && "$3" =~ ^[0-9A-Za-z:/._-]+$ ]] || { echo "::error::unexpected value"; return 1; }
            local sql="$1" quote="'"
            sql="${sql//'$1'/$quote$2$quote}"
            sql="${sql//'$2'/$quote$3$quote}"
            query "$sql"
          }
          # shellcheck disable=SC2016
          upsert() {  # upsert <name> <value>: create or update one Vault secret
            local create='select vault.create_secret($2, $1) where not exists (select 1 from vault.secrets where name = $1)'
            local update='select vault.update_secret(id, $2) from vault.secrets where name = $1'
            if ! query "$create" "$1" "$2" > /dev/null 2>&1; then
              echo "The query endpoint refused parameters; inlining the checked values."
              inline "$create" "$1" "$2" > /dev/null
              inline "$update" "$1" "$2" > /dev/null
              return
            fi
            query "$update" "$1" "$2" > /dev/null
          }
          project_url="https://$PROJECT_REF.supabase.co"
          in_vault=$(query "select count(*)::int as n from vault.secrets where name = 'dualrep_worker_secret'" | jq -r '.[0].n')
          in_functions=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects/$PROJECT_REF/secrets" \
            | jq -r '[if type == "array" then .[] else empty end | select(.name == "DUALREP_WORKER_SECRET")] | length')
          if [ "$in_vault" = "1" ] && [ "$in_functions" = "1" ] && [ "$ROTATE" != "true" ]; then
            action="keep"
          elif [ "$in_vault" = "1" ] && [ "$in_functions" = "1" ]; then
            action="rotate"
          else
            action="create"
          fi
          echo "- Worker secret: $action (Vault has it: $in_vault, functions have it: $in_functions); Vault project URL: $project_url" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then exit 0; fi
          upsert dualrep_project_url "$project_url"
          if [ "$action" = "keep" ]; then exit 0; fi
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          supabase secrets set --project-ref "$PROJECT_REF" "DUALREP_WORKER_SECRET=$secret"
          upsert dualrep_worker_secret "$secret"
          # Read back a hash (not the secret) to prove Vault holds the same value as the function.
          stored=$(query "select md5(decrypted_secret) as h from vault.decrypted_secrets where name = 'dualrep_worker_secret'" | jq -r '.[0].h')
          if [ "$stored" != "$(printf '%s' "$secret" | md5sum | cut -d' ' -f1)" ]; then
            echo "::error::Vault does not hold the new worker secret."
            exit 1
          fi

      - name: Edge Functions
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Deployed now:"
            supabase functions list --project-ref "$PROJECT_REF"
            echo "Would deploy: $(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -not -path '*/_*' | cut -d/ -f3 | sort | xargs)"
            exit 0
          fi
          supabase functions deploy --project-ref "$PROJECT_REF" --use-api
          echo "- Functions deployed: study, tracy-worker" >> "$GITHUB_STEP_SUMMARY"

      # tracy-worker must answer a wrong secret with its own 403 (a gateway 401 would mean verify_jwt
      # was left on), and study must answer a bad token with its own JSON 401.
      - name: Smoke test
        if: ${{ !inputs.dry_run }}
        env:
          TRACY_URL: ${{ vars.TRACY_URL }}
        run: |
          base="https://$PROJECT_REF.supabase.co/functions/v1"
          # A new function can take a few seconds to be served everywhere.
          for _ in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'x-dualrep-worker-secret: wrong' "$base/tracy-worker")
            [ "$code" = "403" ] && break
            sleep 5
          done
          echo "tracy-worker with a wrong secret: HTTP $code"
          [ "$code" = "403" ] || { echo "::error::tracy-worker should answer 403 (got $code)."; exit 1; }
          body=$(curl -s -X POST -H 'Authorization: Bearer not-a-token' -H 'Content-Type: application/json' --data '{}' "$base/study")
          echo "study with a bad token: $body"
          [ "$(jq -r '.code' <<<"$body" 2>/dev/null)" = "unauthorized" ] || { echo "::error::study should answer its own 401."; exit 1; }
          # Tracy on Render's free plan may be asleep; this only reports (and wakes it).
          if curl -fsS --max-time 90 "${TRACY_URL%/}/health" > /dev/null; then
            echo "- Tracy /health: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Tracy's /health did not answer in 90 s. Open it in a browser to check."
          fi
          echo "- Smoke test passed" >> "$GITHUB_STEP_SUMMARY"
